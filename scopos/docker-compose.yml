# SCOPOS Studio = self-hosted Cap (github.com/CapSoftware/Cap), run on the Oracle VM.
# Secrets live in scopos/.env (gitignored). See scopos/README.md.
name: scopos-studio

services:
  cap-web:
    image: ghcr.io/capsoftware/cap-web:${CAP_WEB_TAG:-latest}
    restart: unless-stopped
    depends_on:
      mysql: { condition: service_healthy }
      minio: { condition: service_healthy }
    environment:
      DATABASE_URL: mysql://cap:${MYSQL_PASSWORD}@mysql:3306/cap
      WEB_URL: ${CAP_URL}
      NEXTAUTH_URL: ${CAP_URL}
      DATABASE_ENCRYPTION_KEY: ${DATABASE_ENCRYPTION_KEY}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      MEDIA_SERVER_WEBHOOK_SECRET: ${MEDIA_SERVER_WEBHOOK_SECRET}
      CAP_AWS_ACCESS_KEY: ${S3_ACCESS_KEY}
      CAP_AWS_SECRET_KEY: ${S3_SECRET_KEY}
      CAP_AWS_BUCKET: ${S3_BUCKET:-cap}
      CAP_AWS_REGION: ${S3_REGION:-us-east-1}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_URL}
      S3_INTERNAL_ENDPOINT: ${S3_INTERNAL_URL:-http://minio:9000}
      S3_PATH_STYLE: "true"
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_DOMAIN: ${RESEND_FROM_DOMAIN:-}
      ASSEMBLY_API_KEY: ${ASSEMBLY_API_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      MEDIA_SERVER_URL: http://media-server:3456
      MEDIA_SERVER_WEBHOOK_URL: http://cap-web:3000
    ports:
      - "127.0.0.1:3000:3000"      # local only; Caddy fronts it
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    networks: [cap]

  media-server:
    image: ghcr.io/capsoftware/cap-media-server:${CAP_MEDIA_TAG:-latest}
    restart: unless-stopped
    environment:
      PORT: 3456
      MEDIA_SERVER_WEBHOOK_SECRET: ${MEDIA_SERVER_WEBHOOK_SECRET}
    networks: [cap]

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: cap
      MYSQL_USER: cap
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    command:
      - --max_connections=1000
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes: [mysql-data:/var/lib/mysql]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u cap -p$$MYSQL_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [cap]

  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"      # console: ssh tunnel only
    volumes: [minio-data:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks: [cap]

  minio-setup:
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      /bin/sh -c "mc alias set m http://minio:9000 $$S3_ACCESS_KEY $$S3_SECRET_KEY && mc mb m/$${S3_BUCKET:-cap} --ignore-existing; exit 0"
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-cap}
    networks: [cap]

  caddy:
    image: caddy:2
    restart: unless-stopped
    # Bound to the VM's private NIC (OCI NATs the public IP to it). Tailscale already owns :443 on its own IP.
    ports:
      - "${BIND_IP:-10.0.0.121}:80:80"
      - "${BIND_IP:-10.0.0.121}:443:443"
    environment:
      STUDIO_HOST: ${STUDIO_HOST}
      FILES_HOST: ${FILES_HOST}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [cap]
    profiles: [public]             # start with: docker compose --profile public up -d

volumes:
  mysql-data:
  minio-data:
  caddy-data:
  caddy-config:

networks:
  cap:
